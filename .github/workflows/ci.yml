name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # .github/workflows/actions.lock pins every action the workflows use, and
  # the runner refuses a step whose action has no entry. Renovate regenerates
  # the lockfile with each action update; this catches a hand edit to a
  # `uses:` line, or a new workflow, that was not followed by `gh actions-lock`.
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  licenses:
    name: Third-party notices
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.90.11
        with:
          tool: cargo-about@0.9.3
      - run: make check-licenses

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Check the vendored WITs match the root
        # Before clippy: wit-export is on for every builtin plugin, so a stale
        # copy fails there first with raw wit-bindgen type errors and this
        # step — the one that names the cause — would never run. They are
        # vendored so the crates' wit-bindgen features work from
        # crates.io; a stale copy would generate bindings for the wrong
        # interface. The Go SDK's copy is what componentize-go reads for a
        # plugin that depends on the published module. `make copy-wit`
        # refreshes them all.
        run: |
          diff wit/nginx-lint-plugin.wit crates/nginx-lint-parser/wit/nginx-lint-plugin.wit
          diff wit/nginx-lint-plugin.wit crates/nginx-lint-plugin/wit/nginx-lint-plugin.wit
          diff wit/nginx-lint-plugin.wit plugins/go/nginx-lint-plugin/wit/nginx-lint-plugin.wit
      - run: cargo clippy --workspace -- -D clippy::all

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test -p nginx-lint -p nginx-lint-common -p nginx-lint-parser -p nginx-lint-plugin -p security-rules-plugin

  pages-build:
    name: Pages Build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM for web
        run: wasm-pack build --target web --out-dir web/pkg --no-default-features --features wasm,native-builtin-plugins
      - name: Build API documentation
        run: cargo doc --no-deps -p nginx-lint-plugin -p nginx-lint-parser -p nginx-lint-common
      - name: Copy docs to web
        run: cp -r target/doc web/api
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web

  pages-deploy:
    name: Pages Deploy
    needs: pages-build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
