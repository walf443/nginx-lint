name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # The Linux binaries link the runner's glibc dynamically, so the
          # runner release sets the oldest glibc they run on; both stay on
          # 24.04 rather than following ubuntu-latest to a newer one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      # The Lua plugin builder ships as its own archive: it is only for
      # people writing Lua plugins, and it embeds the Lua runtime, which the
      # linter itself has no use for.
      - name: Build nginx-lint-plugin-sdk
        run: cargo build --release -p nginx-lint-plugin-sdk
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      # A CycloneDX SBOM per binary, attached to the release beside its
      # archive. cargo-cyclonedx always writes one per workspace member next
      # to its Cargo.toml; only the two shipped binaries' are kept. It reads
      # `cargo metadata`, whose resolve merges the features every member
      # enables, dev-dependencies included, so nginx-lint's SBOM also lists
      # crates that only its builtin plugins' tests use (testcontainers and
      # what it pulls in via nginx-lint-plugin's container-testing), which
      # the binary does not link. The SDK's, conversely, misses the C code it
      # carries: Lua, which mlua compiles through a build dependency, and the
      # prebuilt Lua runtime, which cargo does not know about.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate SBOMs
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries \
            --target ${{ matrix.target }} --no-build-deps --quiet
          cp nginx-lint_bin.cdx.json nginx-lint-${{ matrix.target }}.cdx.json
          cp plugins/nginx-lint-plugin-sdk/nginx-lint-plugin-sdk_bin.cdx.json \
            nginx-lint-plugin-sdk-${{ matrix.target }}.cdx.json

      - name: Archive binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nginx-lint dist/
          cp target/${{ matrix.target }}/release/nginx-lint-plugin-sdk dist/
          cd dist
          tar czf ../nginx-lint-${{ matrix.target }}.tar.gz nginx-lint
          tar czf ../nginx-lint-plugin-sdk-${{ matrix.target }}.tar.gz nginx-lint-plugin-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginx-lint-${{ matrix.target }}
          path: |
            nginx-lint-${{ matrix.target }}.tar.gz
            nginx-lint-plugin-sdk-${{ matrix.target }}.tar.gz
            nginx-lint-${{ matrix.target }}.cdx.json
            nginx-lint-plugin-sdk-${{ matrix.target }}.cdx.json

  release:
    name: Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nginx-lint-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            nginx-lint-*.tar.gz
            nginx-lint-*.cdx.json

  tag-go-module:
    name: Tag the Go SDK module
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A Go module in a subdirectory is versioned by a tag prefixed with that
      # subdirectory, so the repository's own v* tag does not version
      # plugins/go/nginx-lint-plugin: without this, `go get` on it can only
      # resolve to a pseudo-version of the default branch. The prefixed tag
      # does not match this workflow's `v*` trigger, so it does not re-enter
      # here.
      - name: Create the Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="plugins/go/nginx-lint-plugin/${GITHUB_REF_NAME}"
          # Re-running a release must not fail here; the tag is created
          # against the same commit either way.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}"
          echo "Created tag ${tag}"

  publish-crates:
    name: Publish to crates.io
    needs: docker
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish nginx-lint-parser
        run: cargo publish -p nginx-lint-parser
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish nginx-lint-common
        run: cargo publish -p nginx-lint-common
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish nginx-lint-plugin
        run: cargo publish -p nginx-lint-plugin
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build-npm:
    name: Build npm package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wasm-parser
      - name: Install wasm-tools
        run: cargo install wasm-tools
      - name: Build parser and fixer WASM components
        # The SDK imports both statically, so a missing fixer fails the whole
        # package build, not just its fix-testing API
        run: |
          cargo build --manifest-path crates/nginx-lint-parser/Cargo.toml \
            --target wasm32-unknown-unknown --release --features wasm
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/nginx_lint_parser.wasm \
            -o target/wasm32-unknown-unknown/release/nginx_lint_parser.component.wasm
          cargo build --manifest-path crates/nginx-lint-common/Cargo.toml \
            --target wasm32-unknown-unknown --release --features wasm
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/nginx_lint_common.wasm \
            -o target/wasm32-unknown-unknown/release/nginx_lint_common.component.wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Transpile parser and fixer WASM to JS
        run: |
          npx jco transpile ../../../target/wasm32-unknown-unknown/release/nginx_lint_parser.component.wasm -o wasm/parser --name parser --instantiation async
          npx jco transpile ../../../target/wasm32-unknown-unknown/release/nginx_lint_common.component.wasm -o wasm/fixer --name fixer --instantiation async
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Build package
        run: npm run build
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-dist
          path: plugins/typescript/nginx-lint-plugin/dist/
      - name: Upload wit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-wit
          path: plugins/typescript/nginx-lint-plugin/wit/
      - name: Upload wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-wasm
          path: plugins/typescript/nginx-lint-plugin/wasm/

  publish-npm:
    name: Publish to npm
    needs: [docker, build-npm]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-dist
          path: plugins/typescript/nginx-lint-plugin/dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-wit
          path: plugins/typescript/nginx-lint-plugin/wit/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-wasm
          path: plugins/typescript/nginx-lint-plugin/wasm/
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: plugins/typescript/nginx-lint-plugin

  docker:
    name: Docker Image
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nginx-lint-x86_64-unknown-linux-gnu
          path: /tmp/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nginx-lint-aarch64-unknown-linux-gnu
          path: /tmp/artifacts
      - name: Prepare build context
        run: |
          mkdir -p /tmp/docker-context
          cd /tmp/artifacts
          tar xzf nginx-lint-x86_64-unknown-linux-gnu.tar.gz
          mv nginx-lint /tmp/docker-context/nginx-lint-amd64
          tar xzf nginx-lint-aarch64-unknown-linux-gnu.tar.gz
          mv nginx-lint /tmp/docker-context/nginx-lint-arm64
          cat > /tmp/docker-context/Dockerfile <<'DOCKERFILE'
          FROM debian:trixie-slim
          ARG TARGETARCH
          COPY nginx-lint-${TARGETARCH} /usr/local/bin/nginx-lint
          ENTRYPOINT ["nginx-lint"]
          DOCKERFILE
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-python:
    name: Build Python wheel and sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Generate the bindings, bundle the WIT and the testkit wasm
        # None of them is committed here, and an `artifacts` glob that matches
        # nothing is silent, so the build would otherwise produce a
        # publishable but unusable package
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          python -m pip install --upgrade pip
          pip install --group dev build
          make bindings copy-wit copy-testkit
      - name: Build
        # Pure Python: one py3-none-any wheel covers every platform
        # wasmtime-py ships for
        working-directory: plugins/python/nginx-lint-plugin
        run: python -m build --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: plugins/python/nginx-lint-plugin/dist/

  verify-python-wheel:
    name: Verify Python wheel
    needs: build-python
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      # Everything below runs against the wheel in a venv, never the source
      # tree: this checkout has no generated bindings, bundled WIT or copied
      # testkit wasm, so a wheel missing any of them fails here rather than
      # after an upload PyPI will not let us replace.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
      - name: Check the wheel is self-contained
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import componentize_py_types, wit_world  # the generated bindings
          import nginx_lint_plugin
          from nginx_lint_plugin import testing  # pulls in wasmtime and the wasm

          wit = nginx_lint_plugin.wit_dir() / "nginx-lint-plugin.wit"
          assert wit.is_file(), f"bundled WIT missing: {wit}"
          config = testing.parse_config("server { server_tokens on; }")
          assert config.all_directives_with_context()
          PY
      - name: Run the SDK test suite against the wheel
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/pip" install pytest
          "$RUNNER_TEMP/wheel-venv/bin/pytest"
      - name: Build the example plugin against the wheel
        # The plugin author's path end to end: type-check, test, and
        # componentize using only what the wheel ships
        working-directory: plugins/python/server-tokens-enabled-py
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --group dev
          PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" make typecheck test build

  verify-python-sdist:
    name: Verify Python sdist
    # Failing here blocks the upload, which PyPI would not let us replace.
    needs: build-python
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Build and install the sdist from source
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/sdist-venv/bin/pip" install dist/*.tar.gz
      - name: Check the sdist-built package works
        run: |
          "$RUNNER_TEMP/sdist-venv/bin/python" - <<'PY'
          import componentize_py_types, wit_world  # the generated bindings
          import nginx_lint_plugin
          from nginx_lint_plugin import testing  # pulls in wasmtime and the wasm

          wit = nginx_lint_plugin.wit_dir() / "nginx-lint-plugin.wit"
          assert wit.is_file(), f"bundled WIT missing: {wit}"
          config = testing.parse_config("server { server_tokens on; }")
          assert config.all_directives_with_context()
          PY

  publish-pypi:
    name: Publish to PyPI
    # After docker, like publish-npm, so a failed release publishes nothing
    needs: [docker, verify-python-wheel, verify-python-sdist]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      # Trusted publishing, like the crates.io and npm jobs; PyPI's
      # project-level publisher is configured on pypi.org
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
