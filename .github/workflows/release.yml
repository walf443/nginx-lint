name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --features plugins
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Archive binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nginx-lint dist/
          cd dist
          tar czf ../nginx-lint-${{ matrix.target }}.tar.gz nginx-lint

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-lint-${{ matrix.target }}
          path: nginx-lint-${{ matrix.target }}.tar.gz

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nginx-lint-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: nginx-lint-*.tar.gz

  tag-go-module:
    name: Tag the Go SDK module
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A Go module in a subdirectory is versioned by a tag prefixed with that
      # subdirectory, so the repository's own v* tag does not version
      # plugins/go/nginx-lint-plugin: without this, `go get` on it can only
      # resolve to a pseudo-version of the default branch. The prefixed tag
      # does not match this workflow's `v*` trigger, so it does not re-enter
      # here.
      - name: Create the Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="plugins/go/nginx-lint-plugin/${GITHUB_REF_NAME}"
          # Re-running a release must not fail here; the tag is created
          # against the same commit either way.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}"
          echo "Created tag ${tag}"

  publish-crates:
    name: Publish to crates.io
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish nginx-lint-parser
        run: cargo publish -p nginx-lint-parser
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish nginx-lint-common
        run: cargo publish -p nginx-lint-common
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish nginx-lint-plugin
        run: cargo publish -p nginx-lint-plugin
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wasm-parser
      - name: Install wasm-tools
        run: cargo install wasm-tools
      - name: Build parser and fixer WASM components
        # The SDK imports both statically, so a missing fixer fails the whole
        # package build, not just its fix-testing API
        run: |
          cargo build --manifest-path crates/nginx-lint-parser/Cargo.toml \
            --target wasm32-unknown-unknown --release --features wasm
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/nginx_lint_parser.wasm \
            -o target/wasm32-unknown-unknown/release/nginx_lint_parser.component.wasm
          cargo build --manifest-path crates/nginx-lint-common/Cargo.toml \
            --target wasm32-unknown-unknown --release --features wasm
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/nginx_lint_common.wasm \
            -o target/wasm32-unknown-unknown/release/nginx_lint_common.component.wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Transpile parser and fixer WASM to JS
        run: |
          npx jco transpile ../../../target/wasm32-unknown-unknown/release/nginx_lint_parser.component.wasm -o wasm/parser --name parser --instantiation async
          npx jco transpile ../../../target/wasm32-unknown-unknown/release/nginx_lint_common.component.wasm -o wasm/fixer --name fixer --instantiation async
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Build package
        run: npm run build
        working-directory: plugins/typescript/nginx-lint-plugin
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-dist
          path: plugins/typescript/nginx-lint-plugin/dist/
      - name: Upload wit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-wit
          path: plugins/typescript/nginx-lint-plugin/wit/
      - name: Upload wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-wasm
          path: plugins/typescript/nginx-lint-plugin/wasm/

  publish-npm:
    name: Publish to npm
    needs: [docker, build-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-dist
          path: plugins/typescript/nginx-lint-plugin/dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-wit
          path: plugins/typescript/nginx-lint-plugin/wit/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-wasm
          path: plugins/typescript/nginx-lint-plugin/wasm/
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: plugins/typescript/nginx-lint-plugin

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nginx-lint-x86_64-unknown-linux-gnu
          path: /tmp/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nginx-lint-aarch64-unknown-linux-gnu
          path: /tmp/artifacts
      - name: Prepare build context
        run: |
          mkdir -p /tmp/docker-context
          cd /tmp/artifacts
          tar xzf nginx-lint-x86_64-unknown-linux-gnu.tar.gz
          mv nginx-lint /tmp/docker-context/nginx-lint-amd64
          tar xzf nginx-lint-aarch64-unknown-linux-gnu.tar.gz
          mv nginx-lint /tmp/docker-context/nginx-lint-arm64
          cat > /tmp/docker-context/Dockerfile <<'DOCKERFILE'
          FROM debian:trixie-slim
          ARG TARGETARCH
          COPY nginx-lint-${TARGETARCH} /usr/local/bin/nginx-lint
          ENTRYPOINT ["nginx-lint"]
          DOCKERFILE
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-python-sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Generate the bindings and bundle the WIT
        # Neither is committed, and a `tool.maturin.include` glob that matches
        # nothing is silent, so the build would otherwise produce a
        # publishable but unusable package
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          python -m pip install --upgrade pip
          pip install componentize-py==0.25.0
          make bindings copy-wit
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: plugins/python/nginx-lint-plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-sdist
          path: plugins/python/nginx-lint-plugin/dist/

  build-python-wheels:
    name: Build Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2014"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            manylinux: "2014"
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: auto
          # Cross-compiled from the arm runner; the macOS SDK is universal
          - target: x86_64-apple-darwin
            os: macos-latest
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor the wheel is built against: abi3-py311 means this one
          # wheel per platform covers every Python >= 3.11
          python-version: "3.11"
      - name: Generate the bindings and bundle the WIT
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          python -m pip install --upgrade pip
          pip install componentize-py==0.25.0
          make bindings copy-wit
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          working-directory: plugins/python/nginx-lint-plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ matrix.target }}
          path: plugins/python/nginx-lint-plugin/dist/

  verify-python-wheel:
    name: Verify Python wheel
    needs: build-python-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-x86_64-unknown-linux-gnu
          path: dist
      # Everything below runs against the wheel in a venv, never the source
      # tree: this checkout has no generated bindings and no bundled WIT, so a
      # wheel missing either fails here rather than after an upload PyPI will
      # not let us replace.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
      - name: Check the wheel is self-contained
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import componentize_py_types, wit_world  # the generated bindings
          import nginx_lint_plugin
          from nginx_lint_plugin import testing  # pulls in the native module

          wit = nginx_lint_plugin.wit_dir() / "nginx-lint-plugin.wit"
          assert wit.is_file(), f"bundled WIT missing: {wit}"
          config = testing.parse_config("server { server_tokens on; }")
          assert config.all_directives_with_context()
          PY
      - name: Run the SDK test suite against the wheel
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/pip" install pytest
          "$RUNNER_TEMP/wheel-venv/bin/pytest"
      - name: Build the example plugin against the wheel
        # The plugin author's path end to end: type-check, test, and
        # componentize using only what the wheel ships
        working-directory: plugins/python/server-tokens-enabled-py
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --group dev
          PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" make typecheck test build

  verify-python-sdist:
    name: Verify Python sdist
    # Only after the crates are on crates.io: the sdist depends on them by
    # version rather than vendoring them, so this is the first moment it can
    # build the way a user's `pip install` will. Failing here blocks the
    # upload, which PyPI would not let us replace.
    needs: [publish-crates, build-python-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-sdist
          path: dist
      - name: Build and install the sdist from source
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --upgrade pip
          # The crates.io index can lag the publish step, so retry rather
          # than fail the release on propagation timing
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/sdist-venv/bin/pip" install dist/*.tar.gz; then
              exit 0
            fi
            echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
      - name: Check the sdist-built package works
        run: |
          "$RUNNER_TEMP/sdist-venv/bin/python" - <<'PY'
          import componentize_py_types, wit_world  # the generated bindings
          import nginx_lint_plugin
          from nginx_lint_plugin import testing  # pulls in the native module

          wit = nginx_lint_plugin.wit_dir() / "nginx-lint-plugin.wit"
          assert wit.is_file(), f"bundled WIT missing: {wit}"
          config = testing.parse_config("server { server_tokens on; }")
          assert config.all_directives_with_context()
          PY

  publish-pypi:
    name: Publish to PyPI
    # publish-crates (through verify-python-sdist) already waits on docker
    needs: [verify-python-wheel, verify-python-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      # Trusted publishing, like the crates.io and npm jobs; PyPI's
      # project-level publisher is configured on pypi.org
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
