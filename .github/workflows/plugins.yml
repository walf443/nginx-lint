name: Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "crates/**"
      - "src/**"
      - "wit/**"
      - "Cargo.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/plugins.yml"
      - "plugins/**"
      - "crates/**"
      - "src/**"
      - "wit/**"
      - "Cargo.toml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  test-plugins:
    name: Test Plugins (${{ matrix.chunk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "test-plugins-${{ matrix.chunk }}"
      - name: Test plugin chunk
        run: |
          plugins=(plugins/builtin/*/*/)
          total=${#plugins[@]}
          chunks=4
          chunk=${{ matrix.chunk }}
          start=$(( chunk * total / chunks ))
          end=$(( (chunk + 1) * total / chunks ))

          for (( i=start; i<end; i++ )); do
            dir="${plugins[$i]}"
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Testing $(basename "$dir")..."
              (cd "$dir" && cargo test)
            fi
          done

  wasm-build:
    name: Build WASM Plugins (${{ matrix.chunk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        chunk: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "wasm-build-${{ matrix.chunk }}"
      - name: Install wasm-tools
        run: |
          WASM_TOOLS_VERSION=1.245.1
          curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar xz --strip-components=1 --wildcards "*/wasm-tools"
          mv wasm-tools /usr/local/bin/
          wasm-tools --version
      - name: Build WASM plugin chunk
        run: |
          plugins=(plugins/builtin/*/*/)
          total=${#plugins[@]}
          chunks=2
          chunk=${{ matrix.chunk }}
          start=$(( chunk * total / chunks ))
          end=$(( (chunk + 1) * total / chunks ))

          for (( i=start; i<end; i++ )); do
            dir="${plugins[$i]}"
            if [ -f "$dir/Cargo.toml" ]; then
              name=$(basename "$dir")
              echo "Building $name..."
              cargo build --manifest-path "$dir/Cargo.toml" \
                --target wasm32-unknown-unknown \
                --target-dir target/wasm-plugins \
                --release
              wasm_name=$(echo "$name" | tr '-' '_')_plugin
              core_wasm="target/wasm-plugins/wasm32-unknown-unknown/release/$wasm_name.wasm"
              out_dir="$dir/target/wasm32-unknown-unknown/release"
              mkdir -p "$out_dir"
              wasm-tools component new "$core_wasm" -o "$out_dir/$wasm_name.wasm.component.wasm"
            fi
          done
      - name: Package WASM components
        run: |
          find plugins/builtin -name "*.wasm.component.wasm" \
            | tar czf "wasm-components-${{ matrix.chunk }}.tar.gz" -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-plugins-${{ matrix.chunk }}
          path: wasm-components-${{ matrix.chunk }}.tar.gz
          retention-days: 1

  check-wasm-builtin-host:
    name: Check Host (wasm-builtin-plugins)
    # The plugin .wasm files are embedded with include_bytes!, so they have
    # to exist before the host compiles. Reuse the components the build jobs
    # already produced rather than rebuilding them here.
    needs: [wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "check-wasm-builtin-host"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasm-plugins-*
          merge-multiple: true
      - name: Restore plugin components
        run: |
          for f in wasm-components-*.tar.gz; do
            tar xzf "$f"
          done
          make collect-plugins-only
          ls target/builtin-plugins/
      - name: Type-check the host with embedded WASM plugins
        # This is the build behind `make build-with-wasm-plugins` and the
        # README's cargo install line. No other job compiles it, so code
        # behind the wasm-builtin-plugins cfg could break unnoticed —
        # `cargo check` catches that without paying for a release build.
        run: cargo check --no-default-features --features cli,wasm-builtin-plugins

  build-host:
    name: Build Host Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "build-host"
      - name: Build nginx-lint and test binary
        run: |
          cargo build --release --no-default-features --features cli,plugins
          cargo test --test wasm_plugin_test --no-default-features --features cli,plugins --release --no-run
      - name: Package binaries
        run: |
          mkdir -p artifacts
          cp target/release/nginx-lint artifacts/
          find target/release/deps -name 'wasm_plugin_test-*' -type f -executable | head -1 | xargs -I{} cp {} artifacts/wasm_plugin_test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-binaries
          path: artifacts/
          retention-days: 1

  python-plugin:
    name: Python Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The lowest version the SDK supports, so CI catches anything that
          # needs a newer one. The abi3 wheel it builds runs on 3.11+.
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "python-plugin"
          workspaces: "plugins/python/nginx-lint-plugin"
      - name: Lint the native module
        # This crate is its own workspace, so the repository-wide Format and
        # Clippy jobs do not reach it
        working-directory: plugins/python/nginx-lint-plugin
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      - name: Install Python tooling
        # From the example plugin's dependency group, so CI and the
        # documented developer setup install the same versions.
        # --group needs pip 25.1+, newer than some bundled pips.
        working-directory: plugins/python/server-tokens-enabled-py
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
      - name: Install nginx-lint-plugin SDK
        working-directory: plugins/python/nginx-lint-plugin
        # `make install` regenerates the bindings from the WIT first: they are
        # not committed, so everything downstream builds against the current
        # wit/nginx-lint-plugin.wit by construction.
        run: make install
      - name: Type-check the Python plugin
        working-directory: plugins/python/server-tokens-enabled-py
        run: make typecheck
      - name: Run SDK unit tests
        working-directory: plugins/python/nginx-lint-plugin
        run: pytest
        env:
          PYTEST_ADDOPTS: -v
      - name: Run Python unit tests
        working-directory: plugins/python/server-tokens-enabled-py
        run: make test
        env:
          PYTEST_ADDOPTS: -v
      - name: Build Python plugin
        working-directory: plugins/python/server-tokens-enabled-py
        run: make build
      - name: Upload Python WASM plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-plugin
          path: plugins/python/server-tokens-enabled-py/server-tokens-enabled-py.wasm
          retention-days: 1

  go-plugin:
    name: Go Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The version both modules declare. componentize-go needs 1.25+.
          go-version: "1.27"
          cache-dependency-path: |
            plugins/go/nginx-lint-plugin/go.sum
            plugins/go/server-tokens-enabled-go/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "go-plugin"
      - name: Install componentize-go
        run: go install github.com/bytecodealliance/componentize-go@v0.4.0
      - name: Check the committed test-helper modules against the crates
        # nginxlinttest embeds the parser and the fix applier as core wasm
        # modules so a plugin's `go test` can use the real ones, which go
        # stale the moment either crate changes without being rebuilt. This
        # builds fresh copies without overwriting the committed ones and
        # requires the two to agree on every configuration in the tree — a
        # byte diff cannot do it, because rustc does not produce the same wasm
        # across toolchains.
        run: make check-testkit-wasm
      - name: Check the committed bindings match the WIT
        # The Go SDK commits its generated bindings, unlike the TypeScript and
        # Python SDKs which regenerate theirs: a Go module is consumed as
        # source and cannot run a code generator on the way in. So nothing
        # else would catch a WIT change that was never regenerated here — the
        # WIT diff in ci.yml only covers the vendored copy, not what was
        # generated from it.
        working-directory: plugins/go/nginx-lint-plugin
        run: |
          make bindings
          # Intent-to-add first: `make bindings` removes and regenerates the
          # directory, so a WIT change that introduces a new generated package
          # leaves an untracked path, which git diff alone reports nothing for.
          git add --intent-to-add -- bindings wit
          git diff --exit-code -- bindings wit
      - name: Check the formatting
        # The repository-wide Format job is cargo fmt, which does not reach Go
        run: |
          unformatted=$(gofmt -l plugins/go)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check the SDK
        working-directory: plugins/go/nginx-lint-plugin
        run: make check
      - name: Check the Go plugin
        working-directory: plugins/go/server-tokens-enabled-go
        run: make check
      - name: Build Go plugin
        working-directory: plugins/go/server-tokens-enabled-go
        run: make build
      - name: Upload Go WASM plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-plugin
          path: plugins/go/server-tokens-enabled-go/server-tokens-enabled-go.wasm
          retention-days: 1

  wasm-integration:
    name: WASM Integration Test
    needs: [wasm-build, typescript-plugin, python-plugin, go-plugin, build-host]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasm-plugins-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ts-plugin
          path: target/ts-plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: py-plugin
          path: target/py-plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-plugin
          path: target/go-plugins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-binaries
          path: artifacts
      - name: Extract WASM plugins
        run: |
          for f in wasm-components-*.tar.gz; do
            tar xzf "$f"
          done
          echo "Discovered WASM plugins:"
          find plugins/builtin -name "*.wasm.component.wasm" | sort
          chmod +x artifacts/wasm_plugin_test artifacts/nginx-lint
      - parallel:
          - name: Run WASM integration tests
            run: ./artifacts/wasm_plugin_test
          - name: Test TypeScript plugin integration
            run: |
              NGINX_LINT=./artifacts/nginx-lint

              # --rule-only makes the exit code meaningful: bad.conf must
              # fail with this rule's warning, and good.conf must exit 0
              # (a CLI crash or plugin-load failure fails either leg).
              if output=$($NGINX_LINT --plugins target/ts-plugins --rule-only server-tokens-enabled-ts --format json plugins/typescript/server-tokens-enabled-ts/examples/bad.conf); then
                echo "ERROR: bad.conf should produce errors from server-tokens-enabled-ts"
                exit 1
              fi
              echo "$output"
              echo "$output" | jq -e '.errors[] | select(.rule == "server-tokens-enabled-ts")' > /dev/null

              output=$($NGINX_LINT --plugins target/ts-plugins --rule-only server-tokens-enabled-ts --format json plugins/typescript/server-tokens-enabled-ts/examples/good.conf)
              echo "$output"
              echo "$output" | jq -e '.errors | length == 0' > /dev/null
          - name: Test Python plugin integration
            run: |
              NGINX_LINT=./artifacts/nginx-lint

              # Same shape as the TypeScript step above; keep the two in sync.
              if output=$($NGINX_LINT --plugins target/py-plugins --rule-only server-tokens-enabled-py --format json plugins/python/server-tokens-enabled-py/examples/bad.conf); then
                echo "ERROR: bad.conf should produce errors from server-tokens-enabled-py"
                exit 1
              fi
              echo "$output"
              echo "$output" | jq -e '.errors[] | select(.rule == "server-tokens-enabled-py")' > /dev/null

              output=$($NGINX_LINT --plugins target/py-plugins --rule-only server-tokens-enabled-py --format json plugins/python/server-tokens-enabled-py/examples/good.conf)
              echo "$output"
              echo "$output" | jq -e '.errors | length == 0' > /dev/null

              # `why` documents externally loaded plugins, and its examples
              # are the ones in examples/*.conf (app.py reads them at build
              # time), so the rendered output must contain that file's text.
              why=$($NGINX_LINT why --plugins target/py-plugins server-tokens-enabled-py 2>&1)
              echo "$why"
              echo "$why" | grep -q 'Rule: server-tokens-enabled-py'
              echo "$why" | grep -q 'hide nginx version\|Server response header'
              # -F, and a non-empty guard: unanchored regex built from file
              # content would match anything if that line were ever blank,
              # leaving this assertion passing vacuously.
              example_line=$(sed -n 2p plugins/python/server-tokens-enabled-py/examples/bad.conf)
              test -n "${example_line// /}"
              grep -qF "$example_line" <<<"$why"
              $NGINX_LINT why --list --plugins target/py-plugins 2>&1 | grep -q 'server-tokens-enabled-py'
          - name: Test Go plugin integration
            run: |
              NGINX_LINT=./artifacts/nginx-lint
              PLUGIN_DIR=target/go-plugins
              EXAMPLES=plugins/go/server-tokens-enabled-go/examples

              # A Go component imports wasi:* whatever the plugin does, so
              # without the flag it must not load at all. That is the default
              # this repository guarantees, and this is the only test that
              # asserts it against a real Go component rather than a fixture.
              #
              # Both outcomes exit nonzero — a refused load makes --rule-only
              # an unknown rule name and exits 2, a successful one reports the
              # finding in bad.conf and exits 1 — so the status alone would
              # pass either way. Pin the status and the message.
              set +e
              denied=$($NGINX_LINT --plugins $PLUGIN_DIR --rule-only server-tokens-enabled-go $EXAMPLES/bad.conf 2>&1)
              denied_status=$?
              set -e
              echo "$denied"
              if [ "$denied_status" -ne 2 ]; then
                echo "ERROR: expected exit 2 without --allow-wasi-plugins, got $denied_status"
                exit 1
              fi
              grep -q 'Failed to load plugin' <<<"$denied"

              # Same shape as the TypeScript and Python steps above; keep the
              # three in sync.
              if output=$($NGINX_LINT --plugins $PLUGIN_DIR --allow-wasi-plugins --rule-only server-tokens-enabled-go --format json $EXAMPLES/bad.conf); then
                echo "ERROR: bad.conf should produce errors from server-tokens-enabled-go"
                exit 1
              fi
              echo "$output"
              echo "$output" | jq -e '.errors[] | select(.rule == "server-tokens-enabled-go")' > /dev/null

              output=$($NGINX_LINT --plugins $PLUGIN_DIR --allow-wasi-plugins --rule-only server-tokens-enabled-go --format json $EXAMPLES/good.conf)
              echo "$output"
              echo "$output" | jq -e '.errors | length == 0' > /dev/null

              # plugins.allow_wasi_plugins grants the same thing from the
              # configuration file, which is what a project with a Go plugin
              # sets instead of passing the flag on every run.
              conf=$(mktemp -d)/allow-wasi.toml
              printf '[plugins]\nallow_wasi_plugins = true\n' > "$conf"
              if output=$($NGINX_LINT --config "$conf" --plugins $PLUGIN_DIR --rule-only server-tokens-enabled-go --format json $EXAMPLES/bad.conf); then
                echo "ERROR: plugins.allow_wasi_plugins did not load the plugin"
                exit 1
              fi
              echo "$output" | jq -e '.errors[] | select(.rule == "server-tokens-enabled-go")' > /dev/null

              # The SDK computes fix offsets in pure Go, reproducing what the
              # host's directive resource would have returned. Applying one is
              # what checks that arithmetic against the host's own.
              tmp=$(mktemp -d)
              cp $EXAMPLES/bad.conf "$tmp/nginx.conf"
              $NGINX_LINT --plugins $PLUGIN_DIR --allow-wasi-plugins --rule-only server-tokens-enabled-go --fix "$tmp/nginx.conf"
              diff $EXAMPLES/good.conf "$tmp/nginx.conf"

              # `why` renders the spec, whose examples are embedded from
              # examples/*.conf at build time, so the output must contain that
              # file's text.
              why=$($NGINX_LINT why --plugins $PLUGIN_DIR --allow-wasi-plugins server-tokens-enabled-go 2>&1)
              echo "$why"
              echo "$why" | grep -q 'Rule: server-tokens-enabled-go'
              # -F, and a non-empty guard: an unanchored regex built from file
              # content would match anything if that line were ever blank.
              example_line=$(sed -n 2p $EXAMPLES/bad.conf)
              test -n "${example_line// /}"
              grep -qF "$example_line" <<<"$why"

  typescript-plugin:
    name: TypeScript Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "build-parser-wasm"
      - parallel:
          - name: Install wasm-tools
            run: |
              WASM_TOOLS_VERSION=1.245.1
              curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
                | tar xz --strip-components=1 --wildcards "*/wasm-tools"
              mv wasm-tools /usr/local/bin/
          - name: Install shared library dependencies
            working-directory: plugins/typescript/nginx-lint-plugin
            run: npm install
      - name: Build parser and fixer WASM components
        # The fixer carries the fix applier, which the testing entry uses to
        # check what a plugin's fixes produce
        run: |
          make build-parser-wasm
          make build-fixer-wasm
      - name: Build shared library
        working-directory: plugins/typescript/nginx-lint-plugin
        run: npm run build
      - name: Run shared library unit tests
        working-directory: plugins/typescript/nginx-lint-plugin
        run: npm test
      - name: Build TypeScript plugin
        working-directory: plugins/typescript/server-tokens-enabled-ts
        run: |
          npm install
          npm run build
      - name: Run TypeScript unit tests
        working-directory: plugins/typescript/server-tokens-enabled-ts
        run: npm test
      - name: Upload TypeScript WASM plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-plugin
          path: plugins/typescript/server-tokens-enabled-ts/dist/server-tokens-enabled-ts.wasm
          retention-days: 1
