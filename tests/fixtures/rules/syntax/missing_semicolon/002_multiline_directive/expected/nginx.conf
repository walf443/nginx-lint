# Directives may spread their arguments over several lines, which extension
# modules such as ngx_lua rely on. Those must not be reported.
http {
  server {
    set_by_lua_file file.lua $var
    arg1
    # a comment between arguments is still the same directive
    arg2;

    index index.html
    index.htm;

    # This one really is missing a semicolon: `server_name example.com`
    # carries its own argument, so it stands alone as a directive.
    listen 80;
    server_name example.com;
  }
}
