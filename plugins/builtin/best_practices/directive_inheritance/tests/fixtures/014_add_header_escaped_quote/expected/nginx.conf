# The copied header must keep the escaped quote escaped, or the rest of the
# string becomes directives
http {
  server {
    add_header X-Note "x\"; return 302 https://evil.example/; #";

    location / {
      add_header X-Note "x\"; return 302 https://evil.example/; #";
      add_header X-Custom "value";
    }
  }
}
