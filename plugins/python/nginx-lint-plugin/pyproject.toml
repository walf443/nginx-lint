[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nginx-lint-plugin"
description = "Python SDK for writing and testing nginx-lint WASM plugins"
readme = "README.md"
# PEP 639: an SPDX expression plus the file itself, so the wheel carries
# the license text rather than only naming it (`license = { text = ... }`
# is deprecated)
license = "MIT"
license-files = ["LICENSE"]
# 3.11+: the committed componentize-py bindings use typing.Self
requires-python = ">=3.11"
# Keep in sync with the repository version (scripts/bump-version.sh does);
# tests/test_testkit.py checks it against the bundled wasm modules
version = "0.24.0"
dependencies = [
    # Runs the parser and fix applier behind nginx_lint_plugin.testing. Only
    # the core-module API is used, which is stable across releases.
    "wasmtime>=49",
]

authors = [{ name = "walf443" }]
keywords = ["nginx", "lint", "linter", "wasm", "plugin", "component-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/walf443/nginx-lint"
Repository = "https://github.com/walf443/nginx-lint"
Issues = "https://github.com/walf443/nginx-lint/issues"
Documentation = "https://github.com/walf443/nginx-lint/blob/main/plugins/python/nginx-lint-plugin/README.md"

# Tools the Makefile targets need: `make bindings` invokes the
# componentize-py CLI directly. Install with `pip install --group dev`.
#
# The componentize-py pin must match the one in
# ../server-tokens-enabled-py/pyproject.toml: this generates the bindings a
# plugin is built against, and componentize-py injects its own matching
# runtime at componentize time, so a mismatch is a silent skew rather than a
# build error.
[dependency-groups]
dev = [
    "pytest",
    "componentize-py==0.25.1",
]

[tool.hatch.build]
# The generated bindings, the bundled WIT and the copied wasm modules are
# gitignored, which hatchling would otherwise leave out of both the wheel
# and the sdist
artifacts = [
    "python/wit_world/**/*.py",
    "python/wit_world/py.typed",
    "python/componentize_py_types.py",
    "python/nginx_lint_plugin/wit/*.wit",
    "python/nginx_lint_plugin/wasm/*.wasm",
]

[tool.hatch.build.targets.wheel]
# Everything under python/ installs top-level: nginx_lint_plugin plus the
# componentize-py bindings wit_world / componentize_py_types, which must
# stay top-level so the same imports resolve inside a componentized plugin
only-include = [
    "python/nginx_lint_plugin",
    "python/wit_world",
    "python/componentize_py_types.py",
]
sources = ["python"]

[tool.hatch.build.targets.sdist]
only-include = ["python", "tests", "Makefile", "README.md", "LICENSE"]
