[package]
name = "nginx-lint-plugin-sdk"
version = "0.24.0"
edition = "2024"
description = "Plugin SDK binary for nginx-lint: builds plugins from Lua scripts"
license = "MIT"
repository = "https://github.com/walf443/nginx-lint"
authors = ["walf443"]
publish = false

[dependencies]
anyhow = "1"
# A native Lua 5.4, for checking a script at build time: it runs the
# script's top level under the same library the runtime embeds, so syntax
# errors and a malformed spec surface here instead of at lint time.
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored", "send"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# The three share types across their APIs (the reencoder takes wasmparser
# values), so they are pinned to one minor together.
wasm-encoder = "=0.259.0"
wasmparser = "=0.259.0"
wit-component = "=0.259.0"

[dev-dependencies]
# The runtime stamps the plugin API version it was built for; the tests
# hold it to the crate's.
nginx-lint-plugin = { path = "../../crates/nginx-lint-plugin" }
sha2 = "0.11"
