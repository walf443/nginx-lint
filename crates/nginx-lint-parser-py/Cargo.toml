[package]
name = "nginx-lint-parser-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python native extension exposing the nginx-lint parser for plugin unit testing"

# The Python module is named `nginx_lint_parser_py` (the `_py` suffix avoids
# a lib-name collision with the `nginx-lint-parser` Rust dependency)
[lib]
name = "nginx_lint_parser_py"
crate-type = ["cdylib"]

[dependencies]
nginx-lint-parser = { path = "../nginx-lint-parser" }
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deliberately not part of the main workspace: building requires a local
# Python interpreter (via maturin), which the main workspace's CI does not
# assume.
[workspace]
