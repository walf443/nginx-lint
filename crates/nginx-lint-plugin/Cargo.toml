[package]
name = "nginx-lint-plugin"
version = "0.19.1"
edition = "2024"
description = "Plugin SDK for nginx-lint"
readme = "README.md"
license = "MIT"
repository = "https://github.com/walf443/nginx-lint"
authors = ["walf443"]

# Anchored, and listing the vendored WIT: wit-export is on by default and is
# what third-party plugins build against, so the interface definition has to
# be in the package (see crates/nginx-lint-parser for the same treatment).
include = ["/src/**", "/tests/**", "/wit/*.wit", "/Cargo.toml", "/README.md"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nginx-lint-common = { version = "0.19.1", path = "../nginx-lint-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.61.0", optional = true }

# Optional dependencies for container testing
testcontainers = { version = "0.28", features = ["http_wait"], optional = true }
reqwest = { version = "0.13", optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[features]
container-testing = ["testcontainers", "reqwest", "tokio"]
wit-export = ["wit-bindgen"]

